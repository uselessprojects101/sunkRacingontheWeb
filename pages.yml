name: Build and deploy web port
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with: { version: 3.1.74, actions-cache-folder: emsdk-cache }
      - name: Build
        working-directory: source/sdl
        run: emmake make -f Makefile.emscripten -j"$(nproc)"
      - name: Assemble site
        run: |
          mkdir site
          cp source/sdl/build-wasm/sonicr.js source/sdl/build-wasm/sonicr.wasm source/sdl/build-wasm/sonicr.data site/
          cp web/index.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
