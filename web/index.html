<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonic R (web)</title>
<style>
  :root { --bg:#10131a; --fg:#e8ecf4; --mut:#8a93a6; --acc:#2f7bff; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
         justify-content:center; gap:16px; background:var(--bg); color:var(--fg);
         font:16px/1.5 system-ui,sans-serif; padding:16px; }
  #panel { max-width:520px; text-align:center; }
  button, label.btn { background:var(--acc); color:#fff; border:0; border-radius:8px; padding:12px 20px;
         font-size:16px; cursor:pointer; display:inline-block; }
  button:disabled { opacity:.5; cursor:default; }
  small, #status { color:var(--mut); }
  #wrap { display:none; width:min(calc(100vw - 32px), 960px); }
  canvas { width:100%; aspect-ratio:4/3; background:#000; display:block; outline:none; }
  progress { width:100%; }
</style>
</head>
<body>
<div id="panel">
  <h1>Sonic R</h1>
  <p>This is only the game engine. You need your own copy of Sonic R (PC) &mdash; pick the
     game folder (the one containing <code>ISLAND</code>, <code>CITY</code>, <code>BIN</code>&hellip;).
     Files stay in your browser; nothing is uploaded.</p>
  <p id="have" hidden>Game data found in this browser.</p>
  <p>
    <label class="btn">Choose game folder
      <input id="pick" type="file" webkitdirectory multiple hidden>
    </label>
    <button id="start" disabled>Start</button>
  </p>
  <progress id="prog" value="0" max="1" hidden></progress>
  <p id="status">Loading engine&hellip;</p>
  <p><small>Arrows + A/Space/Z/X, Enter to confirm.
    <button id="reset" style="background:none;color:var(--mut);padding:0;text-decoration:underline">Clear stored data</button></small></p>
</div>
<div id="wrap"><canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas></div>

<script>
const REQUIRED = ["GENERAL","ISLAND","CITY","RUIN","FACTORY","EMERALD","AI","BIN","SOUND"];
const KEEP = new Set([...REQUIRED, "MUSIC"]);
const $ = id => document.getElementById(id);
const setStatus = t => $("status").textContent = t;

var Module = {
  canvas: $("canvas"),
  noInitialRun: true,
  print: t => console.log(t),
  printErr: t => console.warn(t),
  onRuntimeInitialized() { init(); }
};

function mkdirp(p) {
  let cur = "";
  for (const s of p.split("/").filter(Boolean)) { cur += "/" + s; try { Module.FS.mkdir(cur); } catch (e) {} }
}
function copyTree(src, dst) {
  const FS = Module.FS; mkdirp(dst);
  for (const n of FS.readdir(src)) {
    if (n === "." || n === "..") continue;
    const s = src + "/" + n, d = dst + "/" + n;
    if (FS.isDir(FS.stat(s).mode)) copyTree(s, d);
    else FS.writeFile(d, FS.readFile(s));
  }
}
const syncFS = populate => new Promise((res, rej) =>
  Module.FS.syncfs(populate, e => e ? rej(e) : res()));
const hasGameData = () => REQUIRED.every(d => Module.FS.analyzePath("/data/" + d).exists);

async function init() {
  mkdirp("/data");
  Module.FS.mount(Module.IDBFS, {}, "/data");
  await syncFS(true);                 // restore stored game data + saves
  copyTree("/bundle", "/data");       // NET01.RAW + replay voice WAVs shipped in the repo
  refresh();
}
function refresh() {
  const ok = hasGameData();
  $("have").hidden = !ok; $("start").disabled = !ok;
  setStatus(ok ? "Ready." : "Choose your Sonic R game folder.");
}

$("pick").addEventListener("change", async ev => {
  const files = [...ev.target.files]; if (!files.length) return;
  // Drop the chosen folder's own name unless it is itself a game subfolder.
  const first = files[0].webkitRelativePath.split("/")[0].toUpperCase();
  const strip = KEEP.has(first) ? 0 : 1;
  const todo = files.filter(f => {
    const p = f.webkitRelativePath.split("/");
    return KEEP.has((p[strip] || "").toUpperCase()) && p.length > strip + 1;
  });
  if (!todo.length) { setStatus("That folder doesn't look like Sonic R game data."); return; }
  $("prog").hidden = false; $("prog").max = todo.length; $("prog").value = 0;
  let i = 0;
  for (const f of todo) {
    const rel = f.webkitRelativePath.split("/").slice(strip).map(s => s.toUpperCase());  // filenames must be UPPERCASE
    mkdirp("/data/" + rel.slice(0, -1).join("/"));
    Module.FS.writeFile("/data/" + rel.join("/"), new Uint8Array(await f.arrayBuffer()));
    if (++i % 25 === 0) { $("prog").value = i; setStatus(`Copying ${i}/${todo.length}\u2026`); await new Promise(r => setTimeout(r)); }
  }
  setStatus("Saving to browser storage\u2026");
  await syncFS(false);
  $("prog").hidden = true;
  refresh();
});

$("start").addEventListener("click", () => {
  $("panel").style.display = "none"; $("wrap").style.display = "block";
  $("canvas").focus();
  setInterval(() => syncFS(false).catch(() => {}), 10000);   // persist saves
  addEventListener("keydown", e => {
    if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
  }, { passive:false });
  Module.callMain(["/data"]);          // this click is also the audio-unlock gesture
});

$("reset").addEventListener("click", () => {
  if (!confirm("Delete stored game data and saves from this browser?")) return;
  indexedDB.deleteDatabase("/data"); location.reload();
});
</script>
<script async src="sonicr.js"></script>
</body>
</html>
